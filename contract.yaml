# 工具契约（冻结版，2026-10-03）
#
# 设计原则：
# - 查询类工具可自动执行，无需人工确认
# - 改派 / 赔付 / 通知三类写操作：必须经过人工确认闸
# - 模型只提交业务参数；服务端生成 effect_id 和 idempotency_key
# - mock 实现与未来真实平台 adapter 实现同一契约，切换时 agent 代码零改动

read:
  tms.get_waybill:
    args: [waybill_id]
    returns: 运单运营证据（起止点、货物、承运商、状态、时效要求；不含联系方式）
  tms.get_tracking:
    args: [waybill_id]
    returns: 轨迹证据序列（时间、地点标签、速度、停留事件；不含精确坐标）
  tms.get_driver:
    args: [driver_id]
    returns: 司机运营证据（驾驶时长、疲劳预警；不含姓名、电话和车牌）
  ext.get_road_weather:
    args: [route]
    returns: 沿途路段天气（路段、天气现象、预警等级）

write:
  tms.reassign:
    args: [waybill_id, carrier_id]
    gate: 人工确认（approval pending → confirmed）
  tms.create_claim:
    args: [waybill_id, claim_type]
    gate: 人工确认（approval pending → confirmed）
  notify.send_sms:
    args: [waybill_id, recipient, carrier_id]
    gate: 人工确认（与改派 / 赔付同一审批单，可选）
